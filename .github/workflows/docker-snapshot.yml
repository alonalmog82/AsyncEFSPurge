# Build and push a short-lived snapshot image for every push to a PR branch.
# Use: docker pull ghcr.io/<owner>/asyncefspurge:snapshot-pr-<number>
# These images are overwritten on each push to the PR and are not retained like release images.

name: Docker Snapshot (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/asyncefspurge

jobs:
  build-and-push-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; f=open('pyproject.toml','rb'); d=tomllib.load(f); print(d['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Sanitize branch name for tag
        id: branch-tag
        run: |
          # Docker tag: lowercase, replace / with -, strip invalid chars
          RAW="${{ github.head_ref || github.ref_name }}"
          SANE=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g' | sed 's/[^a-z0-9_.-]//g' | cut -c1-50)
          echo "tag=snapshot-$SANE" >> $GITHUB_OUTPUT

      - name: Build and push snapshot image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:snapshot-pr-${{ github.event.pull_request.number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.branch-tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
